<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloomPetals</title>

  <!-- 1. Bootstrap d'abord -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 2. Notre CSS ensuite, pour qu'il passe par-dessus Bootstrap -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- ===== EN-TÊTE + MENU (toujours visibles) ===== -->
  <div class="haut">
    <header class="header">
      <div class="logo"></div>
      <h1>BloomPetals</h1>
    </header>

    <nav class="menu">
      <a href="#" onclick="afficherPage('accueil'); return false;">Accueil</a>
      <a href="#">Qui sommes nous</a>
      <a href="#">Nos réalisations</a>
      <a href="#" onclick="afficherPage('contact'); return false;">Contact</a>
    </nav>
  </div>


  <!-- ===== ZONE OÙ LES PAGES SONT INCLUSES ===== -->
  <main id="contenu"></main>


  <!-- ===== PIED DE PAGE (toujours visible) ===== -->
  <footer class="footer">
    <nav class="menu">
      <a href="#" onclick="afficherPage('accueil'); return false;">Accueil</a>
      <a href="#">Qui sommes nous</a>
      <a href="#">Nos réalisations</a>
      <a href="#" onclick="afficherPage('contact'); return false;">Contact</a>
    </nav>
  </footer>


  <!-- ===== INCLUSION DES PAGES ===== -->
  <!-- Une balise <script src> n'est pas bloquée par le navigateur,
       même si on ouvre le site par un double-clic : pas de problème de CORS -->
  <script src="pages/accueil.js"></script>
  <script src="pages/contact.js"></script>

  <!-- ===== LE SCRIPT QUI CHANGE DE PAGE ===== -->
  <script>
    // On associe chaque nom de page à sa variable
    const pages = {
      accueil: pageAccueil,
      contact: pageContact
    };

    function afficherPage(nom) {
      // On place le HTML de la page demandée dans la zone <main id="contenu">
      document.getElementById('contenu').innerHTML = pages[nom];

      // On remonte en haut de l'écran
      window.scrollTo(0, 0);
    }

    // Au chargement du site, on affiche la page d'accueil
    afficherPage('accueil');
  </script>

</body>
</html>
