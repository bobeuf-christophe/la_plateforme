<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloomPetals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/carrousel.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>

  <div class="haut">
    <header class="header">
      <img src="./images/logo-bloompetals.png" alt="logo">
    </header>

    <nav class="menu">
      <a href="#" onclick="afficherPage('accueil'); return false;">Accueil</a>
      <a href="#">Qui sommes nous</a>
      <a href="#">Nos réalisations</a>
      <a href="#" onclick="afficherPage('contact'); return false;">Contact</a>
    </nav>
  </div>

  <main id="contenu"></main>

  <footer class="footer">
    <nav class="menu">
      <a href="#" onclick="afficherPage('accueil'); return false;">Accueil</a>
      <a href="#">Qui sommes nous</a>
      <a href="#" onclick="afficherPage('accueil'); return false;">Accueil</a>
      <a href="#" onclick="afficherPage('contact'); return false;">Contact</a>
    </nav>
  </footer>
  <script src="pages/accueil.js"></script>
  <script src="pages/contact.js"></script>
  <script src="js/carrousel.js"></script>
  <script>
    const pages = {
      accueil: pageAccueil,
      contact: pageContact
    };
    function afficherPage(nom) {
      document.getElementById('contenu').innerHTML = pages[nom];
      window.scrollTo(0, 0);

      if (nom === 'accueil') {
        initCarrousel();
      }
    }
    afficherPage('accueil');
  </script>
</body>
</html>
