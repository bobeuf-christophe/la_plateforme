<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloomPetals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="haut">
    <header class="header">
      <div class="logo"></div>
      <h1>BloomPetals</h1>
    </header>

    <nav class="menu">
      <a href="#" onclick="afficherPage('accueil'); return false;">Accueil</a>
      <a href="#">Qui sommes nous</a>
      <a href="#">Nos réalisations</a>
      <a href="#" onclick="afficherPage('contact'); return false;">Contact</a>
    </nav>
  </div>

  <main id="contenu"></main>

  <footer class="footer">
    <nav class="menu">
      <a href="#" onclick="afficherPage('accueil'); return false;">Accueil</a>
      <a href="#">Qui sommes nous</a>
      <a href="#">Nos réalisations</a>
      <a href="#" onclick="afficherPage('contact'); return false;">Contact</a>
    </nav>
  </footer>

  <script>
    async function afficherPage(nom) {
      const reponse = await fetch('pages/' + nom + '.html');
      const html = await reponse.text();
      document.getElementById('contenu').innerHTML = html;
      window.scrollTo(0, 0);
    }
    afficherPage('accueil');
  </script>

</body>
</html>
